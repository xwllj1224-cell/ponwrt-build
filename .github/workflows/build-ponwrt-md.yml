name: Build PonWrt for XG-040G-MD

# 目标：Nokia XG-040G-MD（AN7581 + XG-PON 光口），UBI 布局
# 产物：nokia_xg-040g-md-ubi / nokia_xg-040g-md-ubi-usb-sfp 的 sysupgrade.itb + sha256

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "源码仓库"
        required: true
        default: zhoufla/ponwrt
      source_ref:
        description: "分支或提交"
        required: true
        default: master

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout PonWrt source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repo }}
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1

      - name: Show source info
        run: |
          echo "仓库: ${{ inputs.source_repo }}@${{ inputs.source_ref }}"
          git log -1 --format='提交: %h %ad %s' --date=short

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                     /usr/local/share/boost /opt/hostedtoolcache /usr/share/swift
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache \
            clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext \
            gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool \
            lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano ninja-build \
            p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
            python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig \
            texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
          sudo timedatectl set-timezone Asia/Shanghai
          df -h /

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: |
            dl
            staging_dir
          key: ponwrt-md-v3-${{ hashFiles('configs/an7581.config', 'feeds.conf.default') }}
          restore-keys: |
            ponwrt-md-v3-
            ponwrt-md-
            ponwrt-dl-an7581-md-
            ponwrt-an7581-v2-
            ponwrt-an7583-v2-

      - name: Git network hardening
        run: |
          # runner 出网偶尔挂死（连接不断但零速率），必须让 git 自己断开重试
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 60
          git config --global http.postBuffer 524288000
          git config --global advice.detachedHead false

      - name: Update and install feeds
        timeout-minutes: 40
        run: |
          ok=0
          for i in 1 2 3; do
            echo "::group::feeds update 第 $i 次"
            if timeout 900 ./scripts/feeds update -a; then ok=1; echo "feeds update OK"; break; fi
            echo "第 $i 次失败或超时：清理残缺仓库后续传"
            for d in packages luci routing telephony video pon_drivers pon_userspace; do
              if [ -d "feeds/$d" ] && ! git -C "feeds/$d" rev-parse --verify HEAD >/dev/null 2>&1; then
                echo "清理残缺 feed: $d"; rm -rf "feeds/$d"
              fi
            done
            sleep 15
          done
          if [ "$ok" != 1 ]; then echo "::error::feeds update 连续 3 次失败"; exit 1; fi
          for d in packages luci routing telephony pon_drivers pon_userspace; do
            [ -d "feeds/$d" ] || { echo "::error::feeds/$d 缺失"; exit 1; }
          done
          ./scripts/feeds install -a

      - name: Stage bosa/ri volume data (from repo secrets)
        env:
          BOSA_B64: ${{ secrets.XG040G_BOSA_B64 }}
          RI_B64: ${{ secrets.XG040G_RI_B64 }}
        run: |
          mkdir -p tcboot-parts
          if [ -z "$BOSA_B64" ] || [ -z "$RI_B64" ]; then
            echo "::error::缺少 XG040G_BOSA_B64 / XG040G_RI_B64 密钥，无法把光模块校准与设备身份写进 UBI 卷"
            exit 1
          fi
          printf '%s' "$BOSA_B64" | base64 -d > tcboot-parts/bosa.bin
          printf '%s' "$RI_B64" | base64 -d > tcboot-parts/ri.bin
          ls -l tcboot-parts
          python3 - <<'CHK'
          b = open("tcboot-parts/bosa.bin", "rb").read()
          r = open("tcboot-parts/ri.bin", "rb").read()
          assert len(b) >= 0x202, f"bosa 太短: {len(b)}"
          assert len(r) >= 0x44, f"ri 太短: {len(r)}"
          print("bosa 头部:", b[:2].hex(), "校准数据长度:", len(b) - 2)
          print("ri 序列号:", r[0x1a:0x26].decode("latin1").strip())
          print("ri MAC:", ":".join(f"{x:02x}" for x in r[0x3e:0x44]))
          CHK

      - name: Add tcboot-compatible MD variant (stock U-Boot, non-UBI-kernel)
        run: |
          cat > target/linux/airoha/dts/an758x-nokia_xg-040g-tcboot-parts.dtsi <<'PARTSEOF'
          // SPDX-License-Identifier: GPL-2.0-only OR MIT
          //
          // 原厂 tcboot 布局：bootloader 512K + env 512K + ubi 255M
          // 内核以 FIT 放在 firmware 区起始，rootfs 在 ubi 卷 rootfs 里

          / {
          	chosen {
          		bootargs = "ubi.mtd=ubi root=ubi0:rootfs rootfstype=squashfs ro rootwait console=ttyS0,115200 earlycon";
          	};
          };

          &partitions {
          	partition@0_all {
          		label = "all_flash";
          		reg = <0x0 0x10000000>;
          		read-only;
          	};

          	partition@0 {
          		label = "bootloader";
          		reg = <0x0 0x80000>;
          		read-only;
          	};

          	partition@80000 {
          		label = "env";
          		reg = <0x80000 0x80000>;
          	};

          	partition@100000 {
          		label = "ubi";
          		reg = <0x100000 0xff00000>;
          		compatible = "linux,ubi";

          		volumes {
          			pon_calibration_storage: ubi-volume-bosa {
          				volname = "bosa";

          				nvmem-layout {
          					compatible = "fixed-layout";
          					#address-cells = <1>;
          					#size-cells = <1>;

          					pon_calibration: calibration@2 {
          						reg = <0x2 0x200>;
          					};
          				};
          			};

          			ubi-volume-factory {
          				volname = "ri";

          				nvmem-layout {
          					compatible = "fixed-layout";
          					#address-cells = <1>;
          					#size-cells = <1>;

          					pon_serial: pon-serial@1a {
          						reg = <0x1a 0xc>;
          					};

          					macaddr_factory_3e: macaddr@3e {
          						compatible = "mac-base";
          						reg = <0x3e 0x6>;
          						#nvmem-cell-cells = <1>;
          					};
          				};
          			};
          		};
          	};
          };

          PARTSEOF

          cat > target/linux/airoha/dts/an7581-nokia_xg-040g-md-tcboot.dts <<'DTSEOF'
          // SPDX-License-Identifier: GPL-2.0-only OR MIT

          #include "an7581-nokia_xg-040g-md-common.dtsi"
          #include "an758x-nokia_xg-040g-tcboot-parts.dtsi"

          / {
          	model = "Nokia XG-040G-MD (tcboot)";
          	compatible = "nokia,xg-040g-md", "airoha,an7581", "airoha,en7581";
          };
          DTSEOF

          python3 - <<'PYEOF'
          import re, io
          p = "target/linux/airoha/image/an7581.mk"
          src = open(p, encoding="utf-8").read()
          if "nokia_xg-040g-md-tcboot" in src:
              print("already patched")
          else:
              block = '''
          define Device/nokia_xg-040g-md-tcboot
            $(call Device/nokia_xg-040g-md-common)
            DEVICE_VARIANT := (tcboot)
            DEVICE_DTS := an7581-nokia_xg-040g-md-tcboot
            SUPPORTED_DEVICES += nokia,xg-040g-md
            KERNEL_SIZE := 8192k
            IMAGE_SIZE := 261120k
            KERNEL_LOADADDR := 0x80088000
            UBINIZE_PARTS := bosa=$(TOPDIR)/tcboot-parts/bosa.bin=1 ri=$(TOPDIR)/tcboot-parts/ri.bin=1
            IMAGES := factory.bin sysupgrade.bin
            IMAGE/factory.bin := append-kernel | pad-to $$$$(KERNEL_SIZE) | append-ubi
            IMAGE/sysupgrade.bin := sysupgrade-tar | append-metadata
            DEVICE_PACKAGES += ubi-utils
          endef
          TARGET_DEVICES += nokia_xg-040g-md-tcboot

          '''
              anchor = "define Device/nokia_xg-040g-md-ubi"
              idx = src.find(anchor)
              if idx < 0:
                  raise SystemExit("anchor not found in an7581.mk")
              src = src[:idx] + block + src[idx:]
              open(p, "w", encoding="utf-8").write(src)
              print("patched an7581.mk")
          PYEOF

          echo "=== 新增设备确认 ==="
          grep -n -A14 "Device/nokia_xg-040g-md-tcboot" target/linux/airoha/image/an7581.mk

      - name: Configure (an7581 + XG-040G-MD + 附加包)
        run: |
          cp configs/an7581.config .config

          # 只保留 XG-040G-MD 的两个 profile，注释掉其余 10 个设备。
          # multi-profile 下每个设备各编一份内核，去掉 10 个设备约省 40~60 分钟。
          sed -i -E 's@^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_(fiberhome|gemtek|unionman|znxt)([a-z0-9_-]*)=y$@# CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_\1\2 is not set@' .config
          echo "=== 保留的设备 ==="
          grep -E "^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_[a-z0-9_-]+=y" .config

          cat >> .config <<'EOF'
          # ===== 原厂 tcboot 可引导的整包变体 =====
          CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_nokia_xg-040g-md-tcboot=y
          # ===== LuCI + 中文 + Argon 主题 =====
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-i18n-base-zh-hans=y
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-app-argon-config=y
          # ===== 代理 / 内网穿透 =====
          CONFIG_PACKAGE_luci-app-passwall=y
          CONFIG_PACKAGE_luci-app-openclash=y
          CONFIG_PACKAGE_luci-app-tailscale-community=y
          CONFIG_PACKAGE_luci-app-tailscale=y
          # ===== USB 上网卡 / 5G 模块（MU5001 等）=====
          CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=y
          CONFIG_PACKAGE_kmod-usb-net-rndis=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-mbim=y
          CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y
          CONFIG_PACKAGE_kmod-usb-storage=y
          CONFIG_PACKAGE_kmod-usb-storage-uas=y
          CONFIG_PACKAGE_kmod-usb-serial=y
          CONFIG_PACKAGE_kmod-usb-serial-option=y
          CONFIG_PACKAGE_usb-modeswitch=y
          CONFIG_PACKAGE_usb-modeswitch-data=y
          CONFIG_PACKAGE_uqmi=y
          CONFIG_PACKAGE_umbim=y
          CONFIG_PACKAGE_comgt=y
          # ===== 基础工具 =====
          CONFIG_PACKAGE_https-dns-proxy=y
          CONFIG_PACKAGE_openssh-sftp-server=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_nano=y
          EOF

          make defconfig

      - name: Verify config (fail fast)
        run: |
          echo "=== 设备 profile ==="
          grep -E "CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_[a-z0-9_-]+=y" .config || true
          cnt=$(grep -cE "^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_[a-z0-9_-]+=y" .config || true)
          echo "已选设备数: $cnt"
          if [ "$cnt" -lt 1 ] || [ "$cnt" -gt 4 ]; then
            echo "::error::设备选择异常（$cnt 个），中止以免浪费 3 小时"
            exit 1
          fi
          grep -q "^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_nokia_xg-040g-md-ubi=y" .config \
            || { echo "::error::缺少 nokia_xg-040g-md-ubi"; exit 1; }
          grep -q "^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_nokia_xg-040g-md-tcboot=y" .config \
            || { echo "::error::tcboot 变体未被选中（设备定义可能没生效）"; exit 1; }

          echo "=== 光口驱动（缺一个都白刷）==="
          for p in kmod-airoha-en7572 kmod-airoha-xpon airoha-ponctl airoha-pond; do
            grep -q "CONFIG_PACKAGE_${p}=y" .config \
              || { echo "::error::缺少光口包 $p"; exit 1; }
            echo "OK   $p"
          done

          echo "=== 镜像规则确认 ==="
          grep -n -A16 "define Device/nokia_xg-040g-md-tcboot" target/linux/airoha/image/an7581.mk

          echo "=== 关键包 ==="
          for p in luci luci-theme-argon luci-app-passwall luci-app-openclash \
                   luci-app-tailscale-community kmod-usb-net-qmi-wwan usb-modeswitch \
                   xray-core mihomo https-dns-proxy; do
            if grep -q "CONFIG_PACKAGE_${p}=y" .config; then echo "OK   $p"; else echo "MISS $p"; fi
          done

      - name: Download sources
        timeout-minutes: 30
        run: |
          for i in 1 2 3; do
            echo "::group::make download 第 $i 次"
            # timeout 让卡死的下载中断，dl/ 里已下好的文件会保留，重试只补缺失
            if timeout 1500 make -j"$(nproc)" download; then echo "download OK"; break; fi
            echo "第 $i 次未完成，10s 后续传"
            sleep 10
          done

      - name: Build firmware
        run: make -j"$(nproc)"

      - name: Collect images
        run: |
          set -e
          ls -lh bin/targets/airoha/an7581/ | head -40
          mkdir -p out
          find bin/targets/airoha/an7581 -maxdepth 1 -type f \
               \( -name '*xg-040g-md*' -o -name 'sha256sums' -o -name 'profiles.json' \) \
               -exec cp {} out/ \;
          echo "=== 待上传 ==="
          ls -lh out

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-md-${{ github.run_number }}
          path: out/*
          if-no-files-found: error
          retention-days: 30
