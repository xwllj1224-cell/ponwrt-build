name: Build PonWrt for XG-040G-MD

# 目标：Nokia XG-040G-MD（AN7581 + XG-PON 光口），UBI 布局
# 产物：nokia_xg-040g-md-ubi / nokia_xg-040g-md-ubi-usb-sfp 的 sysupgrade.itb + sha256

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "源码仓库"
        required: true
        default: zhoufla/ponwrt
      source_ref:
        description: "分支或提交"
        required: true
        default: master

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout PonWrt source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repo }}
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1

      - name: Show source info
        run: |
          echo "仓库: ${{ inputs.source_repo }}@${{ inputs.source_ref }}"
          git log -1 --format='提交: %h %ad %s' --date=short

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                     /usr/local/share/boost /opt/hostedtoolcache /usr/share/swift
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache \
            clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext \
            gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool \
            lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano ninja-build \
            p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
            python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig \
            texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
          sudo timedatectl set-timezone Asia/Shanghai
          df -h /

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: |
            dl
            staging_dir
          key: ponwrt-md-v3-${{ hashFiles('configs/an7581.config', 'feeds.conf.default') }}
          restore-keys: |
            ponwrt-md-v3-
            ponwrt-md-
            ponwrt-dl-an7581-md-
            ponwrt-an7581-v2-
            ponwrt-an7583-v2-

      - name: Git network hardening
        run: |
          # runner 出网偶尔挂死（连接不断但零速率），必须让 git 自己断开重试
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 60
          git config --global http.postBuffer 524288000
          git config --global advice.detachedHead false

      - name: Update and install feeds
        timeout-minutes: 40
        run: |
          ok=0
          for i in 1 2 3; do
            echo "::group::feeds update 第 $i 次"
            if timeout 900 ./scripts/feeds update -a; then ok=1; echo "feeds update OK"; break; fi
            echo "第 $i 次失败或超时：清理残缺仓库后续传"
            for d in packages luci routing telephony video pon_drivers pon_userspace; do
              if [ -d "feeds/$d" ] && ! git -C "feeds/$d" rev-parse --verify HEAD >/dev/null 2>&1; then
                echo "清理残缺 feed: $d"; rm -rf "feeds/$d"
              fi
            done
            sleep 15
          done
          if [ "$ok" != 1 ]; then echo "::error::feeds update 连续 3 次失败"; exit 1; fi
          for d in packages luci routing telephony pon_drivers pon_userspace; do
            [ -d "feeds/$d" ] || { echo "::error::feeds/$d 缺失"; exit 1; }
          done
          ./scripts/feeds install -a

      - name: Configure (an7581 + XG-040G-MD + 附加包)
        run: |
          cp configs/an7581.config .config

          # 只保留 XG-040G-MD 的两个 profile，注释掉其余 10 个设备。
          # multi-profile 下每个设备各编一份内核，去掉 10 个设备约省 40~60 分钟。
          sed -i -E 's@^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_(fiberhome|gemtek|unionman|znxt)([a-z0-9_-]*)=y$@# CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_\1\2 is not set@' .config
          echo "=== 保留的设备 ==="
          grep -E "^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_[a-z0-9_-]+=y" .config

          cat >> .config <<'EOF'
          # ===== LuCI + 中文 + Argon 主题 =====
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-i18n-base-zh-hans=y
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-app-argon-config=y
          # ===== 代理 / 内网穿透 =====
          CONFIG_PACKAGE_luci-app-passwall=y
          CONFIG_PACKAGE_luci-app-openclash=y
          CONFIG_PACKAGE_luci-app-tailscale-community=y
          CONFIG_PACKAGE_luci-app-tailscale=y
          # ===== USB 上网卡 / 5G 模块（MU5001 等）=====
          CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=y
          CONFIG_PACKAGE_kmod-usb-net-rndis=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-mbim=y
          CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y
          CONFIG_PACKAGE_kmod-usb-storage=y
          CONFIG_PACKAGE_kmod-usb-storage-uas=y
          CONFIG_PACKAGE_kmod-usb-serial=y
          CONFIG_PACKAGE_kmod-usb-serial-option=y
          CONFIG_PACKAGE_usb-modeswitch=y
          CONFIG_PACKAGE_usb-modeswitch-data=y
          CONFIG_PACKAGE_uqmi=y
          CONFIG_PACKAGE_umbim=y
          CONFIG_PACKAGE_comgt=y
          # ===== 基础工具 =====
          CONFIG_PACKAGE_https-dns-proxy=y
          CONFIG_PACKAGE_openssh-sftp-server=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_nano=y
          EOF

          make defconfig

      - name: Verify config (fail fast)
        run: |
          echo "=== 设备 profile ==="
          grep -E "CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_[a-z0-9_-]+=y" .config || true
          cnt=$(grep -cE "^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_[a-z0-9_-]+=y" .config || true)
          echo "已选设备数: $cnt"
          if [ "$cnt" -lt 1 ] || [ "$cnt" -gt 4 ]; then
            echo "::error::设备选择异常（$cnt 个），中止以免浪费 3 小时"
            exit 1
          fi
          grep -q "^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_nokia_xg-040g-md-ubi=y" .config \
            || { echo "::error::缺少 nokia_xg-040g-md-ubi"; exit 1; }

          echo "=== 关键包 ==="
          for p in luci luci-theme-argon luci-app-passwall luci-app-openclash \
                   luci-app-tailscale-community kmod-usb-net-qmi-wwan usb-modeswitch \
                   xray-core mihomo https-dns-proxy; do
            if grep -q "CONFIG_PACKAGE_${p}=y" .config; then echo "OK   $p"; else echo "MISS $p"; fi
          done

      - name: Download sources
        timeout-minutes: 30
        run: |
          for i in 1 2 3; do
            echo "::group::make download 第 $i 次"
            # timeout 让卡死的下载中断，dl/ 里已下好的文件会保留，重试只补缺失
            if timeout 1500 make -j"$(nproc)" download; then echo "download OK"; break; fi
            echo "第 $i 次未完成，10s 后续传"
            sleep 10
          done

      - name: Build firmware
        run: make -j"$(nproc)"

      - name: Collect images
        run: |
          set -e
          ls -lh bin/targets/airoha/an7581/ | head -40
          mkdir -p out
          find bin/targets/airoha/an7581 -maxdepth 1 -type f \
               \( -name '*xg-040g-md*' -o -name 'sha256sums' -o -name 'profiles.json' \) \
               -exec cp {} out/ \;
          echo "=== 待上传 ==="
          ls -lh out

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-md-${{ github.run_number }}
          path: out/*
          if-no-files-found: error
          retention-days: 30
